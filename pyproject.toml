[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self_forcing"
version = "0.0.1"
description = "Diffusion Distillation project"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@main",
    "transformers>=4.49.0",
    "tokenizers>=0.20.3",
    "accelerate>=1.1.1",
    "tqdm",
    "imageio",
    "easydict",
    "ftfy",
    "dashscope",
    "imageio-ffmpeg",
    "numpy==1.24.4",
    "wandb",
    "omegaconf",
    "einops",
    "av==13.1.0",
    "clip @ git+https://github.com/openai/CLIP.git",
    "open_clip_torch",
    "starlette",
    "pycocotools",
    "lmdb",
    "matplotlib",
    "sentencepiece",
    "pydantic==2.10.6",
    "scikit-image",
    "huggingface_hub[cli]",
    "dominate",
    "nvidia-tensorrt",
    "onnx",
    "onnxruntime",
    "onnxscript",
    "onnxconverter_common",
    "flask",
    "flask-socketio",
    "torchao",
]

[tool.setuptools.packages.find]
include = ["*"]
